# Builds static binaries (no Go needed to run them) for Linux and FreeBSD servers and publishes
# them, with checksums, as a GitHub Release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0          (a tag with a dash, v0.1.0-test1, is a pre-release)
#
# It can also be run by hand from the Actions tab to try the build; the files are then kept as artifacts.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build every platform
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir dist
          # os/arch[/goarm]: 64-bit and 32-bit Intel/AMD, 64-bit ARM (Raspberry Pi 4/5, most ARM servers),
          # 32-bit ARM (older Raspberry Pis), FreeBSD
          for target in linux/amd64 linux/arm64 linux/386 linux/arm/7 freebsd/amd64 freebsd/arm64; do
            IFS=/ read -r os arch arm <<< "$target"
            label="$os-$arch"; [ "$arch" = arm ] && label="$os-armv7"
            ext=""
            d="squatclientdaemon-$VERSION-$label"
            mkdir "$d"
            for cmd in squatterd tf-squatterd; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" -o "$d/$cmd$ext" "./cmd/$cmd"
            done
            cp README.md "$d/README.md"
            cat > "$d/START-HERE.txt" <<'TXT'
          squatterd is a small program that keeps your MUD/MUSH connections alive while SquatClient is closed.
          Run it on a computer that stays on (a shell account, a VPS, a home server). No installation, no Go, no root.

            1. ./squatterd                  start it (leave it running; see README.md for screen/tmux/systemd)
            2. ./squatterd pair             in a second window: prints a one-time code and a fingerprint
            3. In SquatClient: Squatters > Add a squatter > Type "squatterd", enter this machine's host,
               port 10327 and the code, check the fingerprint matches, and trust it.

          tf-squatterd is only for people who already use TinyFugue: TinyFugue starts it for you
          (/squat on). You do not need it for squatterd.
          TXT
            tar -czf "dist/$d.tar.gz" "$d"
          done
          cd dist && sha256sum * > SHA256SUMS && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: squatclientdaemon
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: squatclientdaemon
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
