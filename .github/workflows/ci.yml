name: ci
# Runs on pull requests, on pushes to main, and by hand: not on every branch push or tag.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']   # documentation-only pushes do not need a test run
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal pkg scripts)"
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          # the vendored crypto/tls copy (pkg/tlsmigrate/tls) is upstream Go code with a few patches: not linted
          staticcheck $(go list ./... | grep -v tlsmigrate/tls)
      - name: test (race)
        run: |
          # Known flaky test (issue #1): if it is the ONLY test that failed, run just that test once more.
          # Any other failure, or a second failure of this one, fails the job.
          rc=0; go test -race -count=1 ./... > /tmp/test.log 2>&1 || rc=$?
          cat /tmp/test.log
          if [ $rc -ne 0 ]; then
            failed=$(grep -E '^--- FAIL: ' /tmp/test.log | sed -E 's/^--- FAIL: ([^ ]+).*/\1/' | sort -u)
            if [ "$failed" = "TestReloadWithOpenSSLServer" ]; then
              echo "retrying the known flaky test once"
              go test -race -count=1 -run '^TestReloadWithOpenSSLServer$' ./cmd/squatterd
            else
              exit 1
            fi
          fi
      - name: fuzz smoke
        run: go test ./pkg/wire -run '^$' -fuzz FuzzDecodeClient -fuzztime 20s
      - name: static build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/squatterd
