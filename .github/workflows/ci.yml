name: ci
# Runs on pull requests, on pushes to main, and by hand: not on every branch push or tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal pkg scripts)"
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          # the vendored crypto/tls copy (pkg/tlsmigrate/tls) is upstream Go code with a few patches: not linted
          staticcheck $(go list ./... | grep -v tlsmigrate/tls)
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: fuzz smoke
        run: go test ./pkg/wire -run '^$' -fuzz FuzzDecodeClient -fuzztime 20s
      - name: static build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/squatterd
